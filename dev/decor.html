<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PieDesk decor gallery</title>
    <!-- Dev only: every SVG under src/decor, at full size and at the size PieDesk draws it.
         http://localhost:1470/dev/decor.html?theme=christmas[&bg=light|wall] -->
    <style>
      body { margin: 0; padding: 20px; font: 12px/1.4 "Segoe UI", sans-serif; color: #cbd5e1; background: #0b1020; }
      body.light { background: #e5e7eb; color: #111; }
      body.wall { background: radial-gradient(ellipse at 30% 20%, #1f5f4a, #06281f 45%, #020a08); }
      h2 { margin: 18px 0 8px; font-size: 14px; color: #fff; }
      body.light h2 { color: #000; }
      .grid { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; }
      figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
      .big { outline: 1px dashed rgb(148 163 184 / 0.35); }
      figcaption { font-family: Consolas, monospace; font-size: 11px; opacity: 0.8; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./decor.ts"></script>
  </body>
</html>
