      <path d="M98,31 C104.6,31.4 110.4,29.6 112.4,26 C114,23 110.8,20.4 108.6,23"/>
    </g>
    <!-- fill pass -->
    <g fill="url(#ma-cloud-fill)">
      <circle cx="40" cy="23" r="8"/>
      <circle cx="58.5" cy="17" r="11.5"/>
      <circle cx="77.5" cy="21" r="8.5"/>
