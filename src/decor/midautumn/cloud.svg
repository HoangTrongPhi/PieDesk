      <path d="M92.5,24.6 a0.9,0.9 0 0 1 1.8,0 a1.8,1.8 0 0 1 -3.6,0 a2.7,2.7 0 0 1 5.4,0"/>
      <path d="M33,30.4 C45,28.8 58,31.4 70,29.8 C80,28.6 89,30.6 96,30" opacity="0.6"/>
    </g>
