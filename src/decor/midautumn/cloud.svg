<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40">
  <defs>
    <linearGradient id="ma-cloud-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffcf2"/>
      <stop offset="0.55" stop-color="#fff4d6"/>
      <stop offset="1" stop-color="#f8dd98"/>
