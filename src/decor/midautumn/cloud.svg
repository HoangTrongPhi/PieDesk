    <linearGradient id="ma-cloud-band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="1" stop-color="#f3cf7c"/>
    </linearGradient>
  </defs>

  <g opacity="0.86">
