      <path d="M30,30.6 C21,32.4 13.4,31.6 9.2,28.4 C5.6,25.6 7.4,21 11.2,21.6 C14.2,22.2 14.2,25.6 11.8,26"/>
      <path d="M98,31 C104.6,31.4 110.4,29.6 112.4,26 C114,23 110.8,20.4 108.6,23"/>
    </g>

    <!-- swirl curls -->
    <g fill="none" stroke="#d2a14a" stroke-width="1.15" stroke-linecap="round">
      <path d="M58.5,15.6 a1.8,1.8 0 0 1 3.6,0 a3.6,3.6 0 0 1 -7.2,0 a5.4,5.4 0 0 1 10.8,0 a7.2,7.2 0 0 1 -14.4,0"/>
      <path d="M40,22.4 a1.2,1.2 0 0 1 2.4,0 a2.4,2.4 0 0 1 -4.8,0 a3.6,3.6 0 0 1 7.2,0 a4.8,4.8 0 0 1 -9.6,0"/>
