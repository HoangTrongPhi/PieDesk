<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 40">
  <defs>
    <radialGradient id="ma-khong-minh-halo" cx="15" cy="24" r="16" gradientUnits="userSpaceOnUse" gradientTransform="translate(15 24) scale(1 1.25) translate(-15 -24)">
      <stop offset="0" stop-color="#fdba74" stop-opacity="0.7"/>
      <stop offset="0.55" stop-color="#f97316" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ma-khong-minh-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2531a"/>
      <stop offset="0.45" stop-color="#fb923c"/>
      <stop offset="0.8" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#fff7d6"/>
    </linearGradient>
    <linearGradient id="ma-khong-minh-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a3412" stop-opacity="0.35"/>
      <stop offset="0.28" stop-color="#9a3412" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#9a3412" stop-opacity="0"/>
      <stop offset="1" stop-color="#9a3412" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="ma-khong-minh-inner" cx="15" cy="31" r="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf2" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#fef3c7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- outer glow -->
  <rect x="0" y="0" width="30" height="40" fill="url(#ma-khong-minh-halo)"/>

  <!-- paper envelope, wider at the top -->
  <path d="M4.6,9 C4.4,2.6 25.6,2.6 25.4,9 L22.4,30.8 C20.4,32.2 9.6,32.2 7.6,30.8 Z" fill="url(#ma-khong-minh-paper)"/>
  <path d="M4.6,9 C4.4,2.6 25.6,2.6 25.4,9 L22.4,30.8 C20.4,32.2 9.6,32.2 7.6,30.8 Z" fill="url(#ma-khong-minh-side)"/>
  <path d="M5,9.2 C4.8,3.2 25.2,3.2 25,9.2 L22.4,30.8 C20.4,32.2 9.6,32.2 7.6,30.8 Z" fill="url(#ma-khong-minh-inner)"/>
  <!-- paper seams -->
  <path d="M10.6,4.6 L11.6,31.6 M19.4,4.6 L18.4,31.6" fill="none" stroke="#c2410c" stroke-width="0.45" opacity="0.4"/>
  <!-- top rim light -->
  <path d="M6.2,6.4 C9,4.2 21,4.2 23.8,6.4" fill="none" stroke="#fed7aa" stroke-width="0.7" stroke-linecap="round" opacity="0.85"/>

  <!-- bamboo ring at the mouth -->
  <ellipse cx="15" cy="31.2" rx="7.4" ry="1.5" fill="#fff4d6" stroke="#b45309" stroke-width="0.7"/>
  <!-- cross wires -->
  <path d="M7.8,31.4 L13.6,33.2 M22.2,31.4 L16.4,33.2" stroke="#a16207" stroke-width="0.4"/>
  <!-- flame -->
  <path d="M15,30 C16.7,31.8 17,33.6 15,35.4 C13,33.6 13.3,31.8 15,30 Z" fill="#fb923c"/>
  <path d="M15,31.4 C16,32.6 16.1,33.8 15,34.8 C13.9,33.8 14,32.6 15,31.4 Z" fill="#fffbeb"/>
</svg>
