<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 50">
  <defs>
    <radialGradient id="ma-den-tho-halo" cx="28" cy="30" r="27" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdba74" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#f9a8d4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f9a8d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ma-den-tho-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#ffeef3"/>
      <stop offset="1" stop-color="#f9b4c8"/>
    </linearGradient>
    <radialGradient id="ma-den-tho-glow" cx="25" cy="33" r="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#fde68a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ma-den-tho-ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbcfe8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <clipPath id="ma-den-tho-clip">
      <ellipse cx="25" cy="33" rx="18" ry="12.5"/>
    </clipPath>
  </defs>

  <!-- soft glow -->
  <ellipse cx="28" cy="29" rx="28" ry="21" fill="url(#ma-den-tho-halo)"/>

  <!-- string -->
  <path d="M28,0 L28,21" stroke="#dcc08a" stroke-width="0.9"/>

  <!-- far ear -->
  <path d="M36.6,17.4 C34.6,12 34.6,5.6 36.6,1.8 C39.4,4.2 41,10.4 40.4,16.6 Z" fill="#fde2ea" stroke="#f7a6bf" stroke-width="0.5"/>
  <!-- hind foot -->
  <ellipse cx="14.5" cy="45.4" rx="7" ry="2.8" fill="#fbcfe0" stroke="#f7a6bf" stroke-width="0.5"/>
  <!-- front paw -->
  <ellipse cx="38.6" cy="44" rx="5" ry="2.6" fill="#ffffff" stroke="#f7a6bf" stroke-width="0.5"/>
  <!-- tail puff -->
  <circle cx="7.6" cy="29.6" r="3.6" fill="#ffffff" stroke="#f9c6d6" stroke-width="0.5"/>

  <!-- body -->
  <ellipse cx="25" cy="33" rx="18" ry="12.5" fill="url(#ma-den-tho-paper)"/>
  <g clip-path="url(#ma-den-tho-clip)">
    <rect x="6" y="20" width="38" height="26" fill="url(#ma-den-tho-glow)"/>
    <!-- bamboo ribs under the paper -->
    <g fill="none" stroke="#f3a3ba" stroke-width="0.45" opacity="0.7">
      <ellipse cx="25" cy="33" rx="6" ry="12.5"/>
      <ellipse cx="25" cy="33" rx="12.5" ry="12.5"/>
    </g>
    <!-- red paper cut-outs -->
    <g fill="#e11d2e">
      <path d="M20,30.4 c1.2,-2.4 4,-2.4 4.6,0 c2.4,-0.6 3.4,2 1.4,3.2 c1.6,1.6 -0.2,3.8 -2.2,2.6 c-0.8,2.2 -3.8,1.8 -3.6,-0.6 c-2.4,0.2 -2.8,-2.8 -0.2,-3.2 z"/>
      <circle cx="13.2" cy="38.6" r="1.4"/>
      <circle cx="33" cy="40.2" r="1.2"/>
    </g>
    <circle cx="22.4" cy="32.4" r="1.1" fill="#fde047"/>
    <!-- underside shade -->
    <path d="M6,40 C14,47 34,47 44,40 L44,47 L6,47 Z" fill="#f472b6" opacity="0.18"/>
  </g>
  <ellipse cx="25" cy="33" rx="18" ry="12.5" fill="none" stroke="#f7a6bf" stroke-width="0.6"/>
  <path d="M11,26.6 C15,22.6 21,20.8 27,20.8" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.9"/>

  <!-- head -->
  <ellipse cx="41.6" cy="24.4" rx="9.6" ry="8.6" transform="rotate(-12 41.6 24.4)" fill="url(#ma-den-tho-paper)" stroke="#f7a6bf" stroke-width="0.6"/>
  <path d="M34.4,20.2 C36,17.4 39,16 42,16" fill="none" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round"/>
  <!-- near ear -->
  <path d="M41.2,16.8 C41.2,10.6 43.4,4.6 47.2,1.6 C49.2,5 48.2,11.4 45,17.4 Z" fill="#ffffff" stroke="#f7a6bf" stroke-width="0.55"/>
  <path d="M42.6,15.4 C42.8,10.6 44.4,6.4 46.6,4.2 C47.4,7.4 46.4,11.6 44.4,15.8 Z" fill="url(#ma-den-tho-ear)" opacity="0.85"/>
  <!-- face -->
  <circle cx="44.4" cy="22.6" r="1.8" fill="#e11d2e"/>
  <circle cx="44.9" cy="22" r="0.6" fill="#ffffff"/>
  <ellipse cx="45.6" cy="27.2" rx="2.2" ry="1.3" fill="#fb7185" opacity="0.45"/>
  <path d="M50.6,24.6 C51.4,24.6 51.8,25.4 51.2,26 C50.6,26.4 49.8,26 50,25.2 Z" fill="#f43f5e"/>
  <path d="M50.8,26.2 C50.6,27.4 49.4,27.8 48.6,27.2" fill="none" stroke="#be123c" stroke-width="0.45" stroke-linecap="round"/>
  <path d="M49.4,26.6 L54.6,25.6 M49.4,27.2 L54.4,28.4" stroke="#f3a3ba" stroke-width="0.4" stroke-linecap="round"/>

  <!-- red bow at the neck -->
  <g fill="#e11d2e">
    <path d="M36.4,30.6 L32.4,28 L32.6,33.6 Z"/>
    <path d="M36.4,30.6 L40.4,28.4 L40.2,33.8 Z"/>
    <circle cx="36.4" cy="30.8" r="1.4" fill="#facc15"/>
    <path d="M35.8,31.6 L34.4,35.6 M37,31.6 L38.2,35.4" stroke="#e11d2e" stroke-width="0.9" stroke-linecap="round"/>
  </g>

</svg>
