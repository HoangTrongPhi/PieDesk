<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 60">
  <defs>
    <radialGradient id="ma-tho-ngoc-jade" cx="0.68" cy="0.22" r="0.95">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.32" stop-color="#eefaf3"/>
      <stop offset="0.7" stop-color="#cdebdc"/>
      <stop offset="1" stop-color="#9fd0b8"/>
    </radialGradient>
    <radialGradient id="ma-tho-ngoc-head" cx="0.66" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#eef9f3"/>
      <stop offset="1" stop-color="#bfe2d2"/>
    </radialGradient>
    <linearGradient id="ma-tho-ngoc-ear" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f9a8d4"/>
      <stop offset="1" stop-color="#fce7f3"/>
    </linearGradient>
    <radialGradient id="ma-tho-ngoc-cake" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#f7c46e"/>
      <stop offset="1" stop-color="#c0731f"/>
    </radialGradient>
  </defs>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .ma-tho-ngoc-ears { transform-origin: 33px 18px; animation: ma-tho-ngoc-twitch 6s ease-in-out infinite; }
      .ma-tho-ngoc-spark { transform-box: fill-box; transform-origin: 50% 50%; animation: ma-tho-ngoc-twinkle 3.2s ease-in-out infinite; }
      .ma-tho-ngoc-spark.b { animation-delay: -1.6s; }
    }
    @keyframes ma-tho-ngoc-twitch {
      0%, 84%, 100% { transform: rotate(0deg); }
      88% { transform: rotate(-7deg); }
      92% { transform: rotate(2deg); }
      96% { transform: rotate(-3deg); }
    }
    @keyframes ma-tho-ngoc-twinkle {
      0%, 100% { opacity: 0.25; transform: scale(0.6); }
      50% { opacity: 1; transform: scale(1); }
    }
  </style>

  <!-- moon sparkles -->
  <path class="ma-tho-ngoc-spark" d="M57,2 C57.4,4.6 57.9,5.1 60.4,5.5 C57.9,5.9 57.4,6.4 57,9 C56.6,6.4 56.1,5.9 53.6,5.5 C56.1,5.1 56.6,4.6 57,2 Z" fill="#fff4d6"/>
  <path class="ma-tho-ngoc-spark b" d="M61,13.4 C61.2,14.8 61.5,15.1 62.8,15.3 C61.5,15.5 61.2,15.8 61,17.2 C60.8,15.8 60.5,15.5 59.2,15.3 C60.5,15.1 60.8,14.8 61,13.4 Z" fill="#fde68a"/>

  <!-- tail -->
  <circle cx="5" cy="49.4" r="3.6" fill="#f4fbf7" stroke="#b9dfcd" stroke-width="0.6"/>
  <!-- body -->
  <path d="M40,60 L12,60 C5.6,60 3,53.6 4.4,47.4 C6,39.6 12.6,33 20.4,30 C24.6,28.4 27.6,24.6 30,20 L40.6,26.4 C42.6,31 43.8,38 43.4,44.6 C43,50.6 42,55.6 40,60 Z" fill="url(#ma-tho-ngoc-jade)" stroke="#a9d6c2" stroke-width="0.5"/>
  <path d="M9.6,53 C11,45.4 18.6,41.6 25.6,44.4" fill="none" stroke="#a9d6c2" stroke-width="0.8" stroke-linecap="round" opacity="0.8"/>
  <path d="M41.6,29.4 C43,34 43.4,39.6 42.8,44.6" fill="none" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M40.6,46 C40,50.6 39.4,54.4 38.4,57.4" fill="none" stroke="#a9d6c2" stroke-width="0.7" stroke-linecap="round"/>
  <!-- hind foot -->
  <path d="M10,60 C10,57.6 14,56.6 20,56.8 C25,57 27.6,58.2 27.6,60 Z" fill="#e3f4ec" stroke="#b9dfcd" stroke-width="0.5"/>
  <!-- front paws -->
  <ellipse cx="39.6" cy="58.6" rx="3.2" ry="1.4" fill="#f4fbf7" stroke="#b9dfcd" stroke-width="0.5"/>
  <ellipse cx="43.6" cy="58.5" rx="3" ry="1.4" fill="#ffffff" stroke="#b9dfcd" stroke-width="0.5"/>

  <!-- ears laid back -->
  <g class="ma-tho-ngoc-ears">
    <path d="M33.6,15.4 C28,13.2 21,14 15.6,17.4 C20.6,19.6 27.4,19.6 33.4,18.2 Z" fill="#e3f4ec" stroke="#b9dfcd" stroke-width="0.5"/>
    <path d="M34,18.2 C28,17.6 21.4,19.8 16.8,24.6 C22.4,25.6 29,24 34.6,21 Z" fill="#f7fdfa" stroke="#b9dfcd" stroke-width="0.5"/>
    <path d="M32.6,19.4 C27.6,19.4 22.6,21.2 19.6,23.6 C24,23.8 28.6,22.6 32.4,20.6 Z" fill="url(#ma-tho-ngoc-ear)" opacity="0.8"/>
  </g>

  <!-- head, tilted up toward the moon -->
  <ellipse cx="37.6" cy="22.4" rx="9.8" ry="8" transform="rotate(-34 37.6 22.4)" fill="url(#ma-tho-ngoc-head)"/>
  <ellipse cx="39" cy="25.2" rx="5.4" ry="4" transform="rotate(-20 39 25.2)" fill="#f4fbf7"/>
  <path d="M36.6,14.4 C40.4,12.8 44.4,13.6 46.2,15.6" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
  <!-- face -->
  <circle cx="40.6" cy="19.4" r="1.6" fill="#e11d2e"/>
  <circle cx="41.1" cy="18.8" r="0.55" fill="#ffffff"/>
  <path d="M45.4,15.2 C46.4,15 47,15.8 46.6,16.6 C46,17 45.2,16.6 45.2,15.8 Z" fill="#f472b6"/>
  <path d="M46.2,16.8 C46.2,18 45.4,18.6 44.6,18.4" fill="none" stroke="#db6b9a" stroke-width="0.45" stroke-linecap="round"/>
  <ellipse cx="42.4" cy="22.6" rx="2" ry="1.2" transform="rotate(-30 42.4 22.4)" fill="#fbcfe8" opacity="0.7"/>
  <path d="M46,17.6 L50.6,16.4 M46,18.4 L50.2,19" stroke="#b9dfcd" stroke-width="0.35" stroke-linecap="round"/>

  <!-- tiny mooncake -->
  <g transform="translate(1.6 0)">
    <path d="M46,53.4 V57.2 A7,2.8 0 0 0 60,57.2 V53.4 Z" fill="#a85a17"/>
    <path d="M48,55.6 v3.2 M50.6,56 v3.4 M53,56.2 v3.6 M55.4,56 v3.4 M58,55.6 v3.2" stroke="#6b3209" stroke-width="0.5" opacity="0.5"/>
    <ellipse cx="53" cy="53.4" rx="7" ry="2.8" fill="url(#ma-tho-ngoc-cake)"/>
    <ellipse cx="53" cy="53.4" rx="7" ry="2.8" fill="none" stroke="#e8a752" stroke-width="1.1" stroke-dasharray="0.01 1.6" stroke-linecap="round"/>
    <ellipse cx="53" cy="53.4" rx="4" ry="1.5" fill="none" stroke="#8a4510" stroke-width="0.45" opacity="0.8"/>
    <circle cx="53" cy="53.4" r="0.7" fill="#8a4510" opacity="0.8"/>
  </g>
</svg>
