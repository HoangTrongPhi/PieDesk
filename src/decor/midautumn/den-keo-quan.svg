  <style>
    @media (prefers-reduced-motion: no-preference) {
      .ma-den-keo-quan-turn { animation: ma-den-keo-quan-turn 20s linear infinite; }
      .ma-den-keo-quan-flicker { animation: ma-den-keo-quan-flicker 3s ease-in-out infinite; }
    }
    @keyframes ma-den-keo-quan-turn {
      from { transform: translateX(0); }
      to { transform: translateX(194px); }
    }
    @keyframes ma-den-keo-quan-flicker {
      0%, 100% { opacity: 1; }
      22% { opacity: 0.7; }
      40% { opacity: 0.95; }
      63% { opacity: 0.62; }
      80% { opacity: 0.9; }
    }
  </style>

