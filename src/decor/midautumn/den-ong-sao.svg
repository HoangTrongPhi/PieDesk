<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 64">
  <defs>
    <radialGradient id="ma-den-ong-sao-halo" cx="30" cy="33" r="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#f97316" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ma-den-ong-sao-glow" cx="30" cy="33" r="15.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbe6" stop-opacity="0.98"/>
      <stop offset="0.22" stop-color="#fde68a" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#fb923c" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .ma-den-ong-sao-flame { animation: ma-den-ong-sao-flicker 2.6s ease-in-out infinite; }
      .ma-den-ong-sao-tassel { transform-box: fill-box; transform-origin: 50% 0; animation: ma-den-ong-sao-sway 3.4s ease-in-out infinite; }
      .ma-den-ong-sao-tassel.b { animation-delay: -1.1s; }
      .ma-den-ong-sao-tassel.c { animation-delay: -2.2s; }
    }
    @keyframes ma-den-ong-sao-flicker {
      0%, 100% { opacity: 1; }
      18% { opacity: 0.82; }
      34% { opacity: 0.96; }
      52% { opacity: 0.78; }
      70% { opacity: 0.94; }
      84% { opacity: 0.86; }
    }
    @keyframes ma-den-ong-sao-sway {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }
  </style>

  <!-- warm halo -->
  <circle cx="30" cy="33" r="28" fill="url(#ma-den-ong-sao-halo)"/>

  <!-- string -->
  <path d="M30,0 L30,10.5" stroke="#dcc08a" stroke-width="0.9"/>

  <!-- tassels (behind the star points) -->
  <g stroke-linecap="round" stroke-width="1.2" fill="none">
    <g class="ma-den-ong-sao-tassel">
      <path d="M51.4,27 L49.9,37.6" stroke="#facc15"/>
      <path d="M51.4,27 L51.1,38.4" stroke="#ef4444"/>
      <path d="M51.4,27 L52.4,38" stroke="#fde047"/>
      <path d="M51.4,27 L53.5,37" stroke="#f97316"/>
    </g>
    <g class="ma-den-ong-sao-tassel b">
      <path d="M8.6,27 L6.5,37" stroke="#f97316"/>
      <path d="M8.6,27 L7.6,38" stroke="#fde047"/>
      <path d="M8.6,27 L8.9,38.4" stroke="#ef4444"/>
      <path d="M8.6,27 L10.1,37.6" stroke="#facc15"/>
    </g>
    <g class="ma-den-ong-sao-tassel c">
      <path d="M43.2,52 L41.6,62.6" stroke="#facc15"/>
      <path d="M43.2,52 L42.8,63.4" stroke="#ef4444"/>
      <path d="M43.2,52 L44.2,63.2" stroke="#fde047"/>
      <path d="M43.2,52 L45.4,62.4" stroke="#f97316"/>
    </g>
    <g class="ma-den-ong-sao-tassel">
      <path d="M16.8,52 L14.6,62.4" stroke="#f97316"/>
      <path d="M16.8,52 L15.8,63.2" stroke="#fde047"/>
      <path d="M16.8,52 L17.2,63.4" stroke="#ef4444"/>
      <path d="M16.8,52 L18.4,62.6" stroke="#facc15"/>
    </g>
  </g>

  <!-- cellophane faces: lit from upper-left -->
  <g stroke="none">
    <path d="M30,33 L24.36,25.23 L30,10.5 Z" fill="#ff5a67"/>
    <path d="M30,33 L30,10.5 L35.64,25.23 Z" fill="#f43546"/>
    <path d="M30,33 L35.64,25.23 L51.4,26.05 Z" fill="#e11d2e"/>
    <path d="M30,33 L51.4,26.05 L39.13,35.97 Z" fill="#c8192a"/>
    <path d="M30,33 L39.13,35.97 L43.23,51.2 Z" fill="#b5161f"/>
    <path d="M30,33 L43.23,51.2 L30,42.6 Z" fill="#a0101c"/>
    <path d="M30,33 L30,42.6 L16.77,51.2 Z" fill="#c8192a"/>
    <path d="M30,33 L16.77,51.2 L20.87,35.97 Z" fill="#e11d2e"/>
    <path d="M30,33 L20.87,35.97 L8.6,26.05 Z" fill="#f43546"/>
    <path d="M30,33 L8.6,26.05 L24.36,25.23 Z" fill="#ff5a67"/>
  </g>

  <!-- candle light through the cellophane -->
  <g class="ma-den-ong-sao-flame">
    <path d="M30,10.5 L35.64,25.23 L51.4,26.05 L39.13,35.97 L43.23,51.2 L30,42.6 L16.77,51.2 L20.87,35.97 L8.6,26.05 L24.36,25.23 Z" fill="url(#ma-den-ong-sao-glow)"/>
    <path d="M30,29.4 C31.7,31.4 32.1,33 30,35 C27.9,33 28.3,31.4 30,29.4 Z" fill="#fffdf2" opacity="0.9"/>
  </g>

  <!-- bevel ridges to each point -->
  <g stroke="#7f1019" stroke-width="0.6" stroke-linecap="round" opacity="0.75">
    <path d="M30,33 L30,11.5"/>
    <path d="M30,33 L50.4,26.4"/>
    <path d="M30,33 L42.6,50.3"/>
    <path d="M30,33 L17.4,50.3"/>
    <path d="M30,33 L9.6,26.4"/>
  </g>
  <g stroke="#ffb3b3" stroke-width="0.35" stroke-linecap="round" opacity="0.45">
    <path d="M30,33 L24.36,25.23"/>
    <path d="M30,33 L35.64,25.23"/>
    <path d="M30,33 L20.87,35.97"/>
  </g>

  <!-- yellow paper trim on the bamboo frame -->
  <path d="M30,10.5 L35.64,25.23 L51.4,26.05 L39.13,35.97 L43.23,51.2 L30,42.6 L16.77,51.2 L20.87,35.97 L8.6,26.05 L24.36,25.23 Z" fill="none" stroke="#facc15" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M30,10.5 L35.64,25.23 L51.4,26.05 M8.6,26.05 L24.36,25.23 L30,10.5" fill="none" stroke="#fff3b0" stroke-width="0.5" stroke-linejoin="round" opacity="0.9"/>

  <!-- tassel collars + knots at the points -->
  <g fill="#f59e0b" stroke="#fde68a" stroke-width="0.4">
    <rect x="50.2" y="27.2" width="2.4" height="2.6" rx="0.8"/>
    <rect x="7.4" y="27.2" width="2.4" height="2.6" rx="0.8"/>
    <rect x="42" y="52.2" width="2.4" height="2.6" rx="0.8"/>
    <rect x="15.6" y="52.2" width="2.4" height="2.6" rx="0.8"/>
  </g>
  <g fill="#fde047">
    <circle cx="30" cy="10.6" r="1.2"/>
    <circle cx="51.4" cy="26.4" r="1.25"/>
    <circle cx="8.6" cy="26.4" r="1.25"/>
    <circle cx="43.2" cy="51.4" r="1.25"/>
    <circle cx="16.8" cy="51.4" r="1.25"/>
  </g>
</svg>
