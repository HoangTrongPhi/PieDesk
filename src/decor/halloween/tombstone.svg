<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 100">
  <defs>
    <linearGradient id="hw-tombstone-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bdb5d8"/>
      <stop offset="0.45" stop-color="#8b82ad"/>
      <stop offset="1" stop-color="#5a5180"/>
    </linearGradient>
    <linearGradient id="hw-tombstone-mound" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46335a"/>
      <stop offset="1" stop-color="#22142e"/>
    </linearGradient>
    <linearGradient id="hw-tombstone-wax" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff7e2"/>
      <stop offset="1" stop-color="#d9c08e"/>
    </linearGradient>
    <radialGradient id="hw-tombstone-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#ff9f1c" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff7a18" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .hw-tombstone-fl { transform-box: fill-box; transform-origin: 50% 100%; }
    @media (prefers-reduced-motion: no-preference) {
      .hw-tombstone-fl { animation: hw-tombstone-fl 1.7s ease-in-out infinite; }
      .hw-tombstone-gl { animation: hw-tombstone-gl 1.7s ease-in-out infinite; }
      @keyframes hw-tombstone-fl {
        0%, 100% { transform: scale(1, 1) rotate(0deg); } 20% { transform: scale(0.92, 1.1) rotate(-4deg); }
        45% { transform: scale(1.05, 0.92) rotate(3deg); } 70% { transform: scale(0.96, 1.06) rotate(-2deg); }
      }
      @keyframes hw-tombstone-gl { 0%, 100% { opacity: 1; } 20% { opacity: 0.75; } 45% { opacity: 0.95; } 70% { opacity: 0.7; } }
    }
  </style>

  <!-- stone -->
  <g transform="rotate(-3 45 94)">
    <path d="M23 95 L23 39 C23 19.5 35 9 50 9 C65 9 77 19.5 77 39 L77 95 Z" fill="#3b3358" stroke="#6c6296" stroke-width="0.8"/>
    <path d="M18 95 L18 38 C18 18 30 8 45 8 C60 8 72 18 72 38 L72 95 Z" fill="url(#hw-tombstone-face)"/>
    <path d="M19.4 62 L19.4 38 C19.4 19.6 31 9.4 45 9.4 C52.5 9.4 58.5 12 63 16.5" fill="none" stroke="#ece7fa" stroke-width="1.3" stroke-opacity="0.75" stroke-linecap="round"/>
    <!-- engraved border -->
    <path d="M24.7 90 L24.7 39 C24.7 23.6 33.6 14.7 45 14.7 C56.4 14.7 65.3 23.6 65.3 39 L65.3 90" fill="none" stroke="#e2dcf3" stroke-width="0.9" stroke-opacity="0.45"/>
    <path d="M24 90 L24 39 C24 23 33 14 45 14 C57 14 66 23 66 39 L66 90" fill="none" stroke="#4a4170" stroke-width="0.9" stroke-opacity="0.8"/>
    <!-- RIP -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
      <path d="M29.7 51.8 V35.8 H34.7 C38.7 35.8 40.2 37.8 40.2 40.3 C40.2 42.8 38.7 44.4 34.7 44.4 H29.7 M34.7 44.4 L40.2 51.8 M45.7 35.8 V51.8 M51.7 51.8 V35.8 H56.7 C60.7 35.8 62.2 37.8 62.2 40.3 C62.2 42.8 60.7 44.8 56.7 44.8 H51.7" stroke="#e4def5" stroke-opacity="0.7"/>
      <path d="M29 51 V35 H34 C38 35 39.5 37 39.5 39.5 C39.5 42 38 43.6 34 43.6 H29 M34 43.6 L39.5 51 M45 35 V51 M51 51 V35 H56 C60 35 61.5 37 61.5 39.5 C61.5 42 60 44 56 44 H51" stroke="#352d52"/>
    </g>
    <path d="M33.7 58.2 H57.7" stroke="#e4def5" stroke-opacity="0.6" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M33 57.5 H57" stroke="#3d3560" stroke-width="1.4" stroke-linecap="round"/>
    <!-- cracks -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.1">
      <path d="M67.1 20.6 L63.1 25.6 L65.6 29.6 L61.6 33.4" stroke="#e4def5" stroke-opacity="0.55"/>
      <path d="M66.5 20 L62.5 25 L65 29 L61 32.8 M63.6 26.3 L61 27" stroke="#2e2848"/>
      <path d="M18.6 74.6 L22.6 77.1 L21.6 81.1 L25.3 84" stroke="#e4def5" stroke-opacity="0.45"/>
      <path d="M18 74 L22 76.5 L21 80.5 L24.7 83.4" stroke="#2e2848"/>
    </g>
    <!-- moss -->
    <path d="M17.6 45 L17.6 38 C17.6 26 22.6 17 29.6 11.8 C31.8 10.6 34.2 9.6 37 9.2 C36.6 11.6 34.4 12.4 33.6 14.2 C31.6 14.6 31 17 29 17.8 C28 20.2 25.6 20.8 25 23.2 C23.6 24.8 24 27.6 22.2 29.2 C22.6 32 20.8 33.8 21.2 36.6 C20.2 38.6 21 41.6 17.6 45 Z" fill="#4d7c0f"/>
    <path d="M18.8 41 C18.8 30 22 21.6 28 15.6 C30 13.8 32.4 12.2 35 11.2 C31 15 27.6 17.4 25.6 20.6 C22.6 25 21.4 30 21 34 C20.4 36.6 19.6 39 18.8 41 Z" fill="#84cc16" opacity="0.85"/>
    <path d="M18.4 38 C18.6 27 23 18.6 29.8 12.8 C31.6 11.6 33.4 10.6 35.4 10" fill="none" stroke="#d9f99d" stroke-width="0.8" stroke-opacity="0.8" stroke-linecap="round"/>
    <g fill="#bef264"><circle cx="26.6" cy="19.6" r="0.8"/><circle cx="22.6" cy="27" r="0.7"/><circle cx="31" cy="15.4" r="0.6"/><circle cx="20.2" cy="38.6" r="0.6"/><circle cx="24.4" cy="31.5" r="0.5"/></g>
    <path d="M52 95 C53 90 57 88 61 89 C63 86.5 67 86.5 69 88.5 C71 88 72 89 72 90.5 L72 95 Z" fill="#4d7c0f"/>
    <path d="M55 90.5 C57 89 59.5 89 61.5 90 M64 88.6 C66 88.2 68 88.8 69.5 90" fill="none" stroke="#a3e635" stroke-width="0.9" stroke-linecap="round" stroke-opacity="0.8"/>
  </g>

  <!-- mound -->
  <path d="M0 100 C2 93.5 11 90 24 90 C34 88.2 56 88.2 66 90 C79 90 88 93.5 90 100 Z" fill="url(#hw-tombstone-mound)"/>
  <path d="M1.5 96.5 C4.5 92.5 12 90.5 24 90.5 C34 88.7 56 88.7 66 90.5 C78 90.5 85.5 92.5 88.5 96.5" fill="none" stroke="#7a62a0" stroke-width="0.8" stroke-opacity="0.7"/>

  <!-- grass tufts -->
  <g fill="#4d7c0f">
    <path d="M6 96 Q5.5 89 2.5 86 Q7 88.5 8.5 93 Q9 86.5 11.5 83 Q11 89 10.5 93.5 Q12.5 89.5 15.5 88 Q13 91.5 12.5 96 Z"/>
    <path d="M34 93 Q33 86.5 29.5 84 Q34.5 86 36 90.5 Q37 84 40 81 Q39 86.5 38.5 91 Q40.5 87 44 86 Q41 89.5 40.5 93 Z"/>
    <path d="M60 94 Q60.5 88 57.5 85 Q62 87.5 63 91 Q64.5 85.5 67.5 83.5 Q66 88.5 65.5 92 Q67.5 89 70.5 88.5 Q68 91 67.5 94 Z"/>
  </g>
  <g fill="#84cc16">
    <path d="M8 98 Q7.5 92 5.5 89.5 Q9 91.5 10 95.5 Q11.5 90.5 14 88.5 Q12.5 93 12.5 98 Z"/>
    <path d="M36.5 96 Q36 90 33.5 88 Q37.5 89.5 38.5 93 Q39.8 89 42.5 87.5 Q41 91.5 41 96 Z"/>
    <path d="M62 97 Q62 92 60 89.5 Q63.5 91 64.5 94 Q65.8 90.5 68.5 89.5 Q66.8 93 66.8 97 Z"/>
    <path d="M22 98 Q21 94 18.5 92 Q22.5 93 23.5 95.5 Q24.5 92.5 27 91.5 Q25.5 94.5 25.5 98 Z"/>
  </g>

  <!-- candle -->
  <ellipse class="hw-tombstone-gl" cx="81.5" cy="79" rx="9" ry="11" fill="url(#hw-tombstone-glow)"/>
  <path d="M78.2 84 L78.2 95.6 Q81.5 97.2 84.8 95.6 L84.8 84 Z" fill="url(#hw-tombstone-wax)"/>
  <ellipse cx="81.5" cy="84" rx="3.3" ry="1.1" fill="#fffaf0"/>
  <path d="M83.6 84.4 C84.4 86 84 88 84.5 89.5 C84.8 90.6 83.4 90.8 83.4 89.6 C83.2 88 83 86 83.6 84.4 Z" fill="#fffaf0"/>
  <path d="M81.5 84 L81.5 82.2" stroke="#3a2a1a" stroke-width="0.6" stroke-linecap="round"/>
  <g class="hw-tombstone-fl">
    <path d="M81.5 75.2 C83.6 78 84 80.2 81.5 82.6 C79 80.2 79.4 78 81.5 75.2 Z" fill="#ffb020"/>
    <path d="M81.5 77.6 C82.6 79.4 82.8 80.6 81.5 81.9 C80.2 80.6 80.4 79.4 81.5 77.6 Z" fill="#fff6c2"/>
  </g>
  <path d="M75.5 96.6 Q78 94.4 79 96.8 Q80 94.2 81.8 96.6 Q83 94.6 84.5 96.4 Q86 94.8 87.5 97 Z" fill="#84cc16"/>
</svg>
