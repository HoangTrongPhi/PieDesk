<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 110">
  <defs>
    <radialGradient id="hw-cauldron-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bef264" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#84cc16" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#84cc16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hw-cauldron-fireglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#ff7a18" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff7a18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hw-cauldron-iron" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c1b40"/>
      <stop offset="0.25" stop-color="#46325f"/>
      <stop offset="0.55" stop-color="#26173b"/>
      <stop offset="1" stop-color="#170c25"/>
    </linearGradient>
    <linearGradient id="hw-cauldron-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e5994"/>
      <stop offset="0.45" stop-color="#3f2d5a"/>
      <stop offset="1" stop-color="#22153a"/>
    </linearGradient>
    <radialGradient id="hw-cauldron-brew" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#f0fdd4"/>
      <stop offset="0.3" stop-color="#c6f36b"/>
      <stop offset="0.72" stop-color="#84cc16"/>
      <stop offset="1" stop-color="#4d7c0f"/>
    </radialGradient>
    <radialGradient id="hw-cauldron-bub" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#ecfccb"/>
      <stop offset="1" stop-color="#84cc16"/>
    </radialGradient>
    <linearGradient id="hw-cauldron-log" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a6438"/>
      <stop offset="0.5" stop-color="#5e3419"/>
      <stop offset="1" stop-color="#3a1d0c"/>
    </linearGradient>
    <linearGradient id="hw-cauldron-flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ff5a14"/>
    </linearGradient>
    <clipPath id="hw-cauldron-body">
      <path d="M15 42 C9 60 17 80 40 85 Q60 89 80 85 C103 80 111 60 105 42 Z"/>
    </clipPath>
    <clipPath id="hw-cauldron-mouth">
      <ellipse cx="60" cy="40" rx="41.5" ry="6.6"/>
    </clipPath>
    <filter id="hw-cauldron-blur" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <style>
    .hw-cauldron-bub { transform-box: fill-box; transform-origin: center; }
    .hw-cauldron-b1 { transform: translate(1px, -11px); }
    .hw-cauldron-b2 { transform: translate(-1px, -22px); }
    .hw-cauldron-b3 { transform: translate(0, -5px); }
    .hw-cauldron-b4 { transform: translate(1px, -29px) scale(0.8); }
    .hw-cauldron-fl { transform-box: fill-box; transform-origin: 50% 100%; }
    @media (prefers-reduced-motion: no-preference) {
      .hw-cauldron-b1 { animation: hw-cauldron-rise 3.1s ease-out -0.6s infinite; }
      .hw-cauldron-b2 { animation: hw-cauldron-rise 3.7s ease-out -2.2s infinite; }
      .hw-cauldron-b3 { animation: hw-cauldron-rise 2.7s ease-out -1.5s infinite; }
      .hw-cauldron-b4 { animation: hw-cauldron-rise 4.2s ease-out -3.4s infinite; }
      .hw-cauldron-s1 { animation: hw-cauldron-pop 2.3s ease-in -0.5s infinite; }
      .hw-cauldron-s2 { animation: hw-cauldron-pop 2.9s ease-in -1.9s infinite; }
      .hw-cauldron-s3 { animation: hw-cauldron-pop 1.9s ease-in -1.1s infinite; }
      .hw-cauldron-f1 { animation: hw-cauldron-flame 0.72s ease-in-out infinite alternate; }
      .hw-cauldron-f2 { animation: hw-cauldron-flame 0.55s ease-in-out -0.3s infinite alternate; }
      .hw-cauldron-f3 { animation: hw-cauldron-flame 0.43s ease-in-out -0.2s infinite alternate; }
      .hw-cauldron-pulse { animation: hw-cauldron-pulse 3.2s ease-in-out infinite; }
      .hw-cauldron-fpulse { animation: hw-cauldron-pulse 1.3s ease-in-out -0.4s infinite; }
      @keyframes hw-cauldron-rise {
        0% { transform: translate(0, 0) scale(0.4); opacity: 0; }
        10% { transform: translate(0, -1px) scale(0.8); opacity: 1; }
        60% { transform: translate(1.5px, -19px) scale(1); opacity: 0.95; }
        84% { transform: translate(-1px, -27px) scale(1.1); opacity: 0.85; }
        91%, 100% { transform: translate(-1px, -28px) scale(1.7); opacity: 0; }
      }
      @keyframes hw-cauldron-pop {
        0% { transform: scale(0.2); opacity: 0; }
        15% { opacity: 1; }
        80% { transform: scale(1); opacity: 1; }
        90% { transform: scale(1.25); opacity: 0.8; }
        100% { transform: scale(1.4); opacity: 0; }
      }
      @keyframes hw-cauldron-flame {
        0% { transform: scale(1, 1); }
        30% { transform: scale(0.95, 1.1); }
        65% { transform: scale(1.05, 0.9); }
        100% { transform: scale(0.98, 1.06); }
      }
      @keyframes hw-cauldron-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.65; } }
    }
  </style>

  <!-- glows -->
  <ellipse class="hw-cauldron-pulse" cx="60" cy="30" rx="60" ry="30" fill="url(#hw-cauldron-glow)"/>
  <ellipse class="hw-cauldron-fpulse" cx="60" cy="98" rx="56" ry="12" fill="url(#hw-cauldron-fireglow)"/>

  <!-- legs -->
  <g fill="#281a3a" stroke="#6a5296" stroke-width="0.9" stroke-linejoin="round">
    <path d="M30 78 L21 106 Q20 110 24 110 L28 110 Q30 110 30.5 108 L38 82 Z"/>
    <path d="M90 78 L99 106 Q100 110 96 110 L92 110 Q90 110 89.5 108 L82 82 Z"/>
  </g>

  <!-- logs -->
  <g stroke="#2a1306" stroke-width="0.7">
    <g transform="translate(62 104.2) rotate(-6)">
      <rect x="-24" y="-3.2" width="48" height="6.4" rx="3.2" fill="url(#hw-cauldron-log)"/>
      <ellipse cx="-22.6" cy="0" rx="2.2" ry="3.1" fill="#e2b27a"/>
      <ellipse cx="-22.6" cy="0" rx="1" ry="1.5" fill="none" stroke="#9a6438" stroke-width="0.5"/>
    </g>
    <g transform="translate(58 104.2) rotate(6)">
      <rect x="-24" y="-3.2" width="48" height="6.4" rx="3.2" fill="url(#hw-cauldron-log)"/>
      <ellipse cx="22.6" cy="0" rx="2.2" ry="3.1" fill="#e2b27a"/>
      <ellipse cx="22.6" cy="0" rx="1" ry="1.5" fill="none" stroke="#9a6438" stroke-width="0.5"/>
    </g>
  </g>

  <!-- fire -->
  <path class="hw-cauldron-fl hw-cauldron-f1" d="M40 103 C36 97 39 91 42 87 C43 91 45 92 47 91 C46 85 49 80 53 77 C53 82 55 85 58 84 C57 79 60 75 64 73 C63 79 66 82 69 83 C70 80 72 78 75 79 C74 84 78 87 80 91 C82 95 82 100 79 103 Z" fill="url(#hw-cauldron-flame)"/>
  <path class="hw-cauldron-fl hw-cauldron-f2" d="M45 103 C42 98 44 93 46 90 C47 93 49 94 51 93 C51 88 53 84 56 82 C56 86 58 88 61 88 C61 84 63 81 66 80 C66 85 69 88 71 90 C74 94 74 100 72 103 Z" fill="#ffb020"/>
  <path class="hw-cauldron-fl hw-cauldron-f3" d="M50 103 C48 99 50 96 52 94 C53 96 55 97 57 96 C57 93 59 91 61 90 C61 93 63 95 65 96 C67 98 67 101 66 103 Z" fill="#ffe680"/>

  <!-- handles -->
  <g fill="none" stroke-linecap="round">
    <ellipse cx="11.5" cy="53" rx="4" ry="5" stroke="#3a2852" stroke-width="2.4"/>
    <ellipse cx="108.5" cy="53" rx="4" ry="5" stroke="#2a1b3c" stroke-width="2.4"/>
    <path d="M8 51 Q8.5 57 11.5 58" stroke="#8b72b8" stroke-width="0.8"/>
  </g>

  <!-- pot body -->
  <path d="M15 42 C9 60 17 80 40 85 Q60 89 80 85 C103 80 111 60 105 42 Z" fill="url(#hw-cauldron-iron)"/>
  <g clip-path="url(#hw-cauldron-body)">
    <ellipse class="hw-cauldron-fpulse" cx="60" cy="92" rx="42" ry="15" fill="url(#hw-cauldron-fireglow)"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M15.5 44 C10.5 60 17 78 32 83" stroke="#9077c4" stroke-width="1.2" stroke-opacity="0.75"/>
    <path d="M104.5 44 C108.5 56 105.5 68 98 75" stroke="#a3e635" stroke-width="1.2" stroke-opacity="0.4"/>
    <path d="M30 82 C36 85 42 86.5 48 87.3" stroke="#ffb347" stroke-width="1.2" stroke-opacity="0.65"/>
    <path d="M72 87.3 C80 86.3 86 84.5 92 81" stroke="#ffb347" stroke-width="1.2" stroke-opacity="0.65"/>
    <path d="M24 53 C22 61 24.5 69 30 74" stroke="#ffffff" stroke-width="2.6" stroke-opacity="0.18"/>
    <path d="M30.5 56 C30 59 30.5 61.5 31.5 63.5" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.22"/>
  </g>

  <!-- rim + brew -->
  <ellipse cx="60" cy="41" rx="48" ry="9.5" fill="url(#hw-cauldron-rim)" stroke="#8a72b8" stroke-width="0.8" stroke-opacity="0.8"/>
  <path d="M18 45.5 Q60 56 102 45.5" fill="none" stroke="#a48fd0" stroke-width="0.9" stroke-opacity="0.55" stroke-linecap="round"/>
  <ellipse cx="60" cy="40" rx="41.5" ry="6.6" fill="#1c1030"/>
  <g clip-path="url(#hw-cauldron-mouth)">
    <ellipse cx="60" cy="41.6" rx="41" ry="5.6" fill="url(#hw-cauldron-brew)"/>
    <path d="M30 41.5 Q46 37.6 61 40.2 Q74 42.4 88 39.4" fill="none" stroke="#f7fee7" stroke-width="0.9" stroke-opacity="0.55" stroke-linecap="round"/>
    <circle class="hw-cauldron-bub hw-cauldron-s1" cx="44" cy="40.6" r="2.6" fill="url(#hw-cauldron-bub)" stroke="#4d7c0f" stroke-width="0.4"/>
    <circle class="hw-cauldron-bub hw-cauldron-s2" cx="74" cy="41.8" r="2.1" fill="url(#hw-cauldron-bub)" stroke="#4d7c0f" stroke-width="0.4"/>
    <circle class="hw-cauldron-bub hw-cauldron-s3" cx="61" cy="38.6" r="1.5" fill="url(#hw-cauldron-bub)" stroke="#4d7c0f" stroke-width="0.4"/>
  </g>
  <ellipse class="hw-cauldron-pulse" cx="60" cy="40" rx="41.5" ry="6.6" fill="none" stroke="#a3e635" stroke-width="3" opacity="0.55" filter="url(#hw-cauldron-blur)"/>
  <ellipse cx="60" cy="40" rx="41.5" ry="6.6" fill="none" stroke="#d9f99d" stroke-width="0.8" stroke-opacity="0.7"/>

  <!-- drips -->
  <g fill="#a3e635" stroke="#65a30d" stroke-width="0.4">
    <path d="M35 46.6 L41 46.8 C40.5 50 40.5 53 40.8 56 C41 58.4 38.4 59.2 37.5 57.5 C36.8 55.5 36.2 51 35 46.6 Z"/>
    <path d="M80 47 L85 46.4 C84.6 49 84.4 51 84.6 52.6 C84.7 54.4 82.4 54.6 82 53 C81.6 51.5 81 49.2 80 47 Z"/>
  </g>
  <g fill="#f7fee7" opacity="0.8">
    <ellipse cx="38.3" cy="55.5" rx="0.6" ry="1.2"/>
    <ellipse cx="82.9" cy="51.6" rx="0.5" ry="0.9"/>
  </g>

  <!-- rising bubbles -->
  <g stroke="#ecfccb" stroke-width="0.4" stroke-opacity="0.7" fill="url(#hw-cauldron-bub)" fill-opacity="0.85">
    <circle class="hw-cauldron-bub hw-cauldron-b1" cx="48" cy="36.5" r="2.2"/>
    <circle class="hw-cauldron-bub hw-cauldron-b2" cx="67" cy="36" r="1.8"/>
    <circle class="hw-cauldron-bub hw-cauldron-b3" cx="79" cy="37.5" r="1.4"/>
    <circle class="hw-cauldron-bub hw-cauldron-b4" cx="56" cy="36" r="2.6"/>
  </g>
</svg>
