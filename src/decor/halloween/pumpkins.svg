      @keyframes hw-pumpkins-flk {
        0%, 100% { opacity: 1; } 10% { opacity: .85; } 18% { opacity: .97; } 31% { opacity: .8; }
        43% { opacity: 1; } 57% { opacity: .88; } 66% { opacity: .96; } 79% { opacity: .78; } 88% { opacity: .95; }
      }
    }
  </style>

