<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150">
<style>
@media (prefers-reduced-motion:no-preference){
.tet-banh-chung-pot-fl{transform-origin:75px 148px;animation:tet-banh-chung-pot-fl 1.1s ease-in-out infinite}
.tet-banh-chung-pot-fl2{animation-duration:.8s;animation-delay:-.3s}
.tet-banh-chung-pot-fl3{animation-duration:.6s;animation-delay:-.15s}
.tet-banh-chung-pot-gl{animation:tet-banh-chung-pot-gl 1.6s ease-in-out infinite alternate}
.tet-banh-chung-pot-st{opacity:0;animation:tet-banh-chung-pot-st 4.2s ease-out infinite}
.tet-banh-chung-pot-st2{animation-delay:-1.4s}
.tet-banh-chung-pot-st3{animation-delay:-2.8s}
}
@keyframes tet-banh-chung-pot-fl{0%,100%{transform:scale(1,1) skewX(0)}25%{transform:scale(1.04,.9) skewX(2.5deg)}50%{transform:scale(.97,1.06) skewX(-2deg)}75%{transform:scale(1.02,.95) skewX(1.5deg)}}
@keyframes tet-banh-chung-pot-gl{from{opacity:.55}to{opacity:.9}}
@keyframes tet-banh-chung-pot-st{0%{opacity:0;transform:translate(0,6px)}25%{opacity:1}100%{opacity:0;transform:translate(3px,-16px)}}
</style>
